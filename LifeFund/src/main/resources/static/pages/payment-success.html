<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Successful</title>

    <link rel="stylesheet"
          href="../css/common.css">

    <link rel="stylesheet"
          href="../css/payment-success.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="success-card">

    <div class="countdown">

        Redirecting :
        <span id="seconds">
            7
        </span>

    </div>

    <div class="check">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <h1>

        Payment Successful

    </h1>

    <h2 id="amount">

        ₹0 Donated Successfully

    </h2>

    <p id="message">

        Thank you for supporting ❤️

    </p>

    <p class="small">

        Your contribution will help save a precious life.

    </p>

    <div class="verified">

        <i class="fa-solid fa-shield-heart"></i>

        Razorpay Payment Verified

    </div>

    <div class="progress">

        <div
                id="progressBar"
                class="progress-bar">

        </div>

    </div>

</div>

<script src="../js/payment-success.js"></script>

</html>
