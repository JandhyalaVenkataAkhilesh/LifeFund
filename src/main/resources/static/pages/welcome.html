<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LifeFund</title>

    <link rel="stylesheet"
          href="../css/common.css">

    <link rel="stylesheet"
          href="../css/welcome.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="welcome-container">

    <div class="welcome-card">

        <div class="logo">

            ❤️

        </div>

        <h1>LifeFund</h1>

        <p class="tagline">

            Help Save Lives Through Crowdfunding

        </p>

        <p class="description">

            Every donation gives someone another chance at life.
            Join us in supporting patients and families who need help.

        </p>

        <div class="button-group">

            <button
                    class="btn btn-primary"
                    id="loginBtn">

                Login

            </button>

            <button
                    class="btn register-btn"
                    id="signupBtn">

                Register

            </button>

            <button
                    class="btn google-btn"
                    id="googleBtn">

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>

        </div>

    </div>

</div>

<script src="../js/welcome.js"></script>

</body>

</html>
